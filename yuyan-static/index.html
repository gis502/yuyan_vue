<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" href="./img/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>雨燕应急-重大灾害无人机应急合作机制</title>
    <link rel="stylesheet" href="./css/main.css" />
    <link rel="stylesheet" href="./css/banner.css" />
    <link rel="stylesheet" href="./css/introduction.css" />
    <link rel="stylesheet" href="./css/announcement.css" />
    <link rel="stylesheet" href="./css/dynamics.css" />
    <link rel="stylesheet" href="./css/disaster-emergency.css" />
    <link rel="stylesheet" href="./css/local-dynamics.css" />
    <link rel="stylesheet" href="./css/technology-frontier.css" />
    <link rel="stylesheet" href="./css/search-team.css" />
    <link rel="stylesheet" href="./css/footer.css" />
    <link rel="stylesheet" href="./css/swiper-bundle.min.css" />

    <script src="./js/utils.js"></script>
    <script src="./js/config.js"></script>
    <script src="./js/operation/introduction.js"></script>
    <script src="./js/static/introduction.js"></script>
    <script src="./js/operation/notice.js"></script>
    <script src="./js/static/notice.js"></script>
    <script src="./js/operation/dynamics.js"></script>
    <script src="./js/static/dynamics.js"></script>
    <script src="./js/operation/disaster-emergency.js"></script>
    <script src="./js/static/disaster-emergency.js"></script>
    <script src="./js/operation/local-dynamics.js"></script>
    <script src="./js/static/local-dynamics.js"></script>
    <script src="./js/operation/technology-frontier.js"></script>
    <script src="./js/static/technology-frontier.js"></script>
    <script src="./js/operation/team.js"></script>
    <script src="./js/static/team.js"></script>
    <script src="./js/static/swiper-bundle.min.js"></script>
</head>

<body>
    <div class="app">
        <div class="index">
            <div class="banner">
                <img class="banner-img" src="./img/logo.png" />
                <div class="banner-title">
                    <div class="title-line1">雨燕应急</div>
                    <div class="title-line2">重大灾害无人机应急合作机制</div>
                </div>
                <div class="banner-maker">应急管理部国家减灾中心制作</div>
            </div>

            <!-- 内容 -->
            <div class="middle-container">
                <!-- 介绍 -->
                <div class="introduction-container">
                    <div class="text">
                        <div class="text-content"></div>
                    </div>
                </div>

                <!-- 通知公告 -->
                <div class="announcement-container">
                    <div class="title">
                        <div class="title-content"></div>
                    </div>
                    <div class="container">
                        <div class="container-list"></div>
                    </div>
                </div>

                <!-- 机制动态 -->
                <div class="dynamics-container">
                    <div class="title">
                        <div class="title-content"></div>
                    </div>
                    <div class="dynamics-list">
                        <div class="list-container"></div>
                        <div class="show-more">
                            <div class="dynamics-item">
                                <a href="./moreInfo.html?type=dynamic" class="dynamics-date">查看更多</a>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 灾害应急 -->
                <div class="disaster-container">
                    <div class="title">
                        <div class="title-content"></div>
                    </div>
                    <div class="disaster-map">
                        <ul></ul>
                    </div>

                    <div class="disaster-item">
                        <a href="./moreInfo.html?type=disaster" class="disaster-date">查看更多</a>
                    </div>
                </div>

                <!-- 地方动态 -->
                <div class="local-dynamics-container">
                    <div class="title">
                        <div class="title-content"></div>
                    </div>
                    <div class="local-dynamics-list">
                        <div class="list-container"></div>
                        <div class="show-more">
                            <div class="dynamics-item">
                                <a href="./moreInfo.html?type=local-dynamic" class="dynamics-date">查看更多</a>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 技术前沿 -->
                <div class="technical-container">
                    <div class="title">
                        <div class="title-content"></div>
                    </div>
                    <div class="list">
                        <div class="technology-list">
                            <ul></ul>
                        </div>
                    </div>

                    <div class="tech-item">
                        <a href="./moreInfo.html?type=technology" class="tech-date">查看更多</a>
                    </div>
                </div>

                <!-- 队伍查询 -->
                <div class="team-search-container">
                     <div class="title">
                        <div class="title-content"></div>
                    </div>

                    <div class="search-box-container">
                        <input type="text" class="search-box" placeholder="请输入队伍名称关键词查询" />
                    </div>

                    <div class="team-list-container"> </div>
                </div>
            </div>
        </div>

        <!-- 底部信息 -->
        <div id="footer_container"></div>
    </div>

    <script>
        // 添加标题
        function loadTitles() {
            const titles = document.getElementsByClassName("title-content");
            const titleContents = [
                ["通知", "公告"],
                ["机制", "动态"],
                ["灾害", "应急"],
                ["地方", "动态"],
                ["技术", "前沿"],
                ["队伍", "查询"]
            ];
            for (let i = 0; i < titles.length; i++) {
                titles[i].innerHTML = `
                <img src="./img/titleLeft.png">
                <span class="title-span">${titleContents[i][0]}<span class="title-blue">${titleContents[i][1]}</span></span>
                <img src="./img/titleRight.png"/>
            `;
            }
        }

        // 页面加载完成后执行
        window.onload = function () {
            // 加载介绍内容
            loadIntroductionContent();

            // 创建标题
            loadTitles();

            // 加载公告内容
            loadNoticeContent();

            // 加载机制动态内容
            loadDynamicsContent();

            // 加载灾害应急内容
            loadDisasterEmergencyContent();

            // 加载地方动态内容
            loadLocalDynamicsContent();

            // 加载技术前沿内容
            loadTechnologyFrontierContent();

            // 加载团队信息内容
            loadTeamContent();

            // 加载公共组件
            Utils.insertCommonFooter("footer_container");
        };
    </script>
</body>

</html>
